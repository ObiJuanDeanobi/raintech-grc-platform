<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CMMC L2 Evidence Tracker{% endblock %}</title>
  <script>
    (function () {
      var saved = localStorage.getItem("cmmc-theme");
      var prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.dataset.theme = saved || (prefersDark ? "dark" : "light");
    })();
  </script>
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="/">CMMC L2 Evidence Tracker</a>
    <div class="topbar-actions">
      <nav>
        <a href="/">Dashboard</a>
        <a href="/platform">GRC Platform</a>
        <a href="/objectives">Objectives</a>
        <a href="/evidence">Evidence</a>
        <a href="/reports/completion">Completion XLSX</a>
        <a href="/exports/zip">Export ZIP</a>
      </nav>
      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch color theme">
        <span data-theme-icon>◐</span>
        <span data-theme-label>Theme</span>
      </button>
    </div>
  </header>
  <main class="page">
    {% block content %}{% endblock %}
  </main>
  <script src="/static/theme.js"></script>
  {% block scripts %}{% endblock %}
</body>
</html>
