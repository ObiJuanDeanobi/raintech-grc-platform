name: Decision Needed
description: Track a product, compliance, or architecture decision
title: "[Decision]: "
labels: ["decision-needed"]
body:
  - type: textarea
    id: decision
    attributes:
      label: Decision
      description: What needs to be decided?
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: List the real options being considered.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: Current recommended path and why.
  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What changes depending on this decision?
