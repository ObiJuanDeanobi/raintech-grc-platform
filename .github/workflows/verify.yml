name: Verify

# Independent verification of what agents report. Every gate in AGENTS.md and
# docs/PROJECT_OPERATING_MODEL.md is otherwise self-reported by the agent doing
# the work; this workflow is the part that cannot be talked around.
#
# Production jobs (API tests, Python static checks, lint) are added here as the
# vertical slices land. The prototype job no-ops on branches without a prototype.

on:
  push:
  pull_request:

jobs:
  catalog:
    name: Framework catalog structure and counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect catalog tests
        id: detect
        run: |
          if [ -d tests ] && [ -d catalog ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No catalog on this branch; nothing to verify."
          fi

      - name: Set up Python
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only, so there is nothing to install. The tests run
      # against the committed catalog fixture and the committed source XML and
      # make no network calls, so eCFR availability cannot break CI.
      - name: Catalog structure and count tests
        if: steps.detect.outputs.present == 'true'
        run: python -m unittest discover -s tests -v

      - name: Catalog fixture is reproducible from its pinned source
        if: steps.detect.outputs.present == 'true'
        run: |
          python catalog/hipaa_ingest.py \
            --snapshot 2026-07-01 \
            --retrieved 2026-07-27 \
            --out /tmp/regenerated.json
          if ! diff -q catalog/versions/hipaa-45cfr164-2026-07-01.json /tmp/regenerated.json; then
            echo "::error::Committed catalog does not match what the ingestion script produces from the pinned source."
            diff catalog/versions/hipaa-45cfr164-2026-07-01.json /tmp/regenerated.json | head -40
            exit 1
          fi

  prototype:
    name: Prototype typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect prototype workspace
        id: detect
        run: |
          if [ -f prototypes/v1-project-workspace/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No prototype workspace on this branch; nothing to verify."
          fi

      - name: Set up pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: prototypes/v1-project-workspace/pnpm-lock.yaml

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: prototypes/v1-project-workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: prototypes/v1-project-workspace
        run: pnpm run typecheck

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: prototypes/v1-project-workspace
        run: pnpm run build
