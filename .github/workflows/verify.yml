name: Verify

# Independent verification of what agents report. Every gate in AGENTS.md and
# docs/PROJECT_OPERATING_MODEL.md is otherwise self-reported by the agent doing
# the work; this workflow is the part that cannot be talked around.
#
# Production jobs (API tests, Python static checks, lint) are added here as the
# vertical slices land. The prototype job no-ops on branches without a prototype.

on:
  push:
  pull_request:

jobs:
  application:
    name: Production workspace
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install API dependencies
        run: python -m pip install -e ".[dev]"

      - name: API tests and static checks
        run: |
          pytest
          ruff check .
          mypy catalog api

      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm install --frozen-lockfile

      - name: Web tests and build
        run: |
          pnpm run typecheck
          pnpm run lint
          pnpm run test
          pnpm run build

  catalog:
    name: Framework catalog structure and counts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect catalog tests
        id: detect
        run: |
          if [ -d tests ] && [ -d catalog ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No catalog on this branch; nothing to verify."
          fi

      - name: Set up Python
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Standard library only, so there is nothing to install. The tests run
      # against the committed catalog fixture and the committed source XML and
      # make no network calls, so eCFR availability cannot break CI.
      # Checks needing the NIST PDF skip here and run in the step below.
      - name: Catalog structure and count tests
        if: steps.detect.outputs.present == 'true'
        run: python -m unittest discover -s tests -v

      - name: Catalog fixture is reproducible from its pinned source
        if: steps.detect.outputs.present == 'true'
        run: |
          python catalog/hipaa_ingest.py \
            --snapshot 2026-07-01 \
            --retrieved 2026-07-27 \
            --out /tmp/regenerated.json
          if ! diff -q catalog/versions/hipaa-45cfr164-2026-07-01.json /tmp/regenerated.json; then
            echo "::error::Committed catalog does not match what the ingestion script produces from the pinned source."
            diff catalog/versions/hipaa-45cfr164-2026-07-01.json /tmp/regenerated.json | head -40
            exit 1
          fi

      # The one job that needs a dependency. Extraction from the pinned
      # 800-66r2 PDF is the only thing PyMuPDF is used for, so it is installed
      # for this step alone and never becomes an application dependency. The
      # PDF is committed, so this makes no network calls either.
      - name: Install pinned extraction dependencies
        if: steps.detect.outputs.present == 'true'
        run: python -m pip install -r catalog/requirements-extraction.txt

      # RAINTECH_REQUIRE_NIST=1 turns these tests' skip-when-unavailable into a
      # failure. Without it a broken install would leave the corpus-wide
      # extraction checks silently unrun, which is the failure mode that let a
      # one-standard sample certify a defect across the other 21.
      - name: NIST section resolution across all Security standards
        if: steps.detect.outputs.present == 'true'
        env:
          RAINTECH_REQUIRE_NIST: '1'
        run: python -m unittest tests.test_nist_section_resolution -v

      # The prompt layer gets the same reproducibility guarantee as the
      # catalog: it must be exactly what the pinned sources produce, not a
      # file that was generated once and then drifted.
      - name: Prompt layer and export are reproducible from pinned sources
        if: steps.detect.outputs.present == 'true'
        run: |
          python catalog/hipaa_prompts.py --layer --out /tmp/regenerated-prompts.json
          if ! diff -q catalog/versions/hipaa-45cfr164-2026-07-01-prompts.json /tmp/regenerated-prompts.json; then
            echo "::error::Committed prompt layer does not match what the ingestion script produces."
            diff catalog/versions/hipaa-45cfr164-2026-07-01-prompts.json /tmp/regenerated-prompts.json | head -40
            exit 1
          fi
          python catalog/hipaa_export.py \
            --catalog catalog/versions/hipaa-45cfr164-2026-07-01.json \
            --prompts catalog/versions/hipaa-45cfr164-2026-07-01-prompts.json \
            --out /tmp/regenerated-export.md
          if ! diff -q docs/catalogs/hipaa-45cfr164-2026-07-01.md /tmp/regenerated-export.md; then
            echo "::error::Committed export does not match what the export script produces."
            diff docs/catalogs/hipaa-45cfr164-2026-07-01.md /tmp/regenerated-export.md | head -40
            exit 1
          fi

  prototype:
    name: Prototype typecheck and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Detect prototype workspace
        id: detect
        run: |
          if [ -f prototypes/v1-project-workspace/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "No prototype workspace on this branch; nothing to verify."
          fi

      - name: Set up pnpm
        if: steps.detect.outputs.present == 'true'
        uses: pnpm/action-setup@v4
        with:
          version: 11.5.3

      - name: Set up Node
        if: steps.detect.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: prototypes/v1-project-workspace/pnpm-lock.yaml

      - name: Install
        if: steps.detect.outputs.present == 'true'
        working-directory: prototypes/v1-project-workspace
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        if: steps.detect.outputs.present == 'true'
        working-directory: prototypes/v1-project-workspace
        run: pnpm run typecheck

      - name: Build
        if: steps.detect.outputs.present == 'true'
        working-directory: prototypes/v1-project-workspace
        run: pnpm run build
